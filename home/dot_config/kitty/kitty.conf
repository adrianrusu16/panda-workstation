# 🐼 Panda Workstation — Kitty trial profile
# Deliberately mirrors Ghostty's font, palette, padding, and shell so the comparison is about terminal behavior.

font_family JetBrainsMono Nerd Font Mono
bold_font auto
italic_font auto
bold_italic_font auto
font_size 11.5
disable_ligatures never

window_padding_width 10
placement_strategy center
remember_window_size yes

shell_integration enabled
cursor_shape beam
cursor_blink_interval 0

background #0b0f14
foreground #d8dee9
cursor #7ee787
selection_background #263342
selection_foreground #ffffff

color0 #0b0f14
color1 #ff7b72
color2 #7ee787
color3 #d29922
color4 #58a6ff
color5 #bc8cff
color6 #39c5cf
color7 #d8dee9
color8 #586069
color9 #ffa198
color10 #aff5b4
color11 #e3b341
color12 #79c0ff
color13 #d2a8ff
color14 #56d4dd
color15 #ffffff

# Tabs and splits
enabled_layouts splits,tall,stack
tab_bar_style powerline
tab_powerline_style slanted
active_tab_font_style bold
inactive_tab_font_style normal

# Shared trial shortcuts
map ctrl+shift+enter launch --location=split --cwd=current
map ctrl+shift+z toggle_layout stack

# Ergonomics
enable_audio_bell no
scrollback_lines 10000
url_style curly
