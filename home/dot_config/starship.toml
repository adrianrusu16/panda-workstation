# 🐼 Panda Workstation — Starship prompt
# Context-first: keep the prompt compact and only show language modules in matching projects.

add_newline = true
command_timeout = 1200
scan_timeout = 30

format = """
[╭─ 🐼 ](bold white)$directory$git_branch$git_status$rust$nodejs$python$java$cmake$c
[╰─](bright-black)$character"""

right_format = "$cmd_duration$jobs$status$time"

[directory]
style = "bold cyan"
format = "[$path]($style)[$read_only]($read_only_style) "
truncation_length = 4
truncate_to_repo = false
home_symbol = "~"
read_only = " 󰌾"
read_only_style = "bold red"

[git_branch]
symbol = " "
style = "bold purple"
format = "[$symbol$branch]($style) "
truncation_length = 32

[git_status]
style = "bold yellow"
format = "([$all_status$ahead_behind]($style) )"
conflicted = "="
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "*${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

[character]
success_symbol = "[❯](bold green) "
error_symbol = "[❯](bold red) "
vimcmd_symbol = "[❮](bold green) "

[cmd_duration]
min_time = 1000
show_milliseconds = false
format = "[󱦟 $duration](bright-black) "

[jobs]
symbol = "󰜎 "
style = "bold blue"
format = "[$symbol$number]($style) "
number_threshold = 1

[status]
disabled = false
symbol = "✘"
success_symbol = ""
format = "[$symbol$status]($style) "
style = "bold red"

[time]
disabled = false
time_format = "%H:%M"
format = "[$time](bright-black)"

[rust]
symbol = " "
style = "bold red"
format = "[$symbol$version]($style) "

[nodejs]
symbol = " "
style = "bold green"
format = "[$symbol$version]($style) "

[python]
symbol = " "
style = "bold yellow"
format = "[$symbol$version]($style) "

[java]
symbol = " "
style = "bold red"
format = "[$symbol$version]($style) "

[cmake]
symbol = " "
style = "bold blue"
format = "[$symbol$version]($style) "

[c]
symbol = " "
style = "bold blue"
format = "[$symbol$version]($style) "
