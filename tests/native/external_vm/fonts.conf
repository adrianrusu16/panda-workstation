<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Future isolated guest input. Never include the system font directories. -->
  <dir>/inputs/fonts</dir>
  <cachedir>/private/cache/fontconfig</cachedir>
  <config><rescan><int>0</int></rescan></config>
</fontconfig>
