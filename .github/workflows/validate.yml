name: 🐼 Validate Workstation

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: 🧪 Validate configuration
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🧰 Install CI validation dependencies
        run: |
          sudo apt-get update
          # Headless rendering dependencies for the disposable Ubuntu runner only.
          sudo apt-get install -y \
            fish python3-gi python3-gi-cairo python3-cairo \
            gir1.2-pango-1.0 gir1.2-rsvg-2.0 libfontconfig1

      - name: ✅ Run Panda validation
        run: fish bootstrap/validate.fish

      - name: 🧪 Test palette and AI bootstrap contracts
        run: /usr/bin/python3 -B -m unittest discover -s tests -v
