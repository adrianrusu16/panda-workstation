name: Contribution policy

on:
  # Run the base branch workflow and policy. PR history is untrusted data only.
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

jobs:
  policy:
    name: Contribution standards
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out trusted base policy and history
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch PR commit objects without checking out PR files
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 -I -c 'import os,re; assert re.fullmatch(r"[0-9a-f]{40}|[0-9a-f]{64}", os.environ["PR_HEAD_SHA"])'
          git -c protocol.file.allow=never fetch --no-tags --no-recurse-submodules origin "$PR_HEAD_SHA"

      - name: Validate branch, title, commits and new file paths
        run: python3 -I -B .github/scripts/check_contribution.py --event "$GITHUB_EVENT_PATH"

      - name: Exercise trusted policy regressions
        run: python3 -B -m unittest discover -s tests -p test_contribution_policy.py -v
