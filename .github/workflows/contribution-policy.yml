name: Contribution policy

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

jobs:
  policy:
    name: Contribution standards
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out PR history
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate branch, title, commits and new file paths
        run: python3 -B .github/scripts/check_contribution.py --event "$GITHUB_EVENT_PATH"

      - name: Exercise policy regressions
        run: python3 -B -m unittest discover -s tests -p test_contribution_policy.py -v
