name: Offline Audit Lab regressions

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-lab:
    name: Check offline Audit Lab contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Install Fish in the disposable CI runner
        run: |
          sudo apt-get update
          sudo apt-get install -y fish

      - name: Run synthetic Audit Lab regressions
        run: python3 -B -m unittest discover -s virtualization/tests -v
